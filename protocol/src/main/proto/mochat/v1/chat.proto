syntax = "proto3";

package mochat.v1;

option java_package = "com.github.lystran.mochat.protocol.proto";
option java_outer_classname = "Mochat";

message SendAck {
  int64 clientMsgId = 1;
  int64 msgId = 2;
  int64 seq = 3;
  int64 serverTimeMs = 4;
}

message ErrorResponse {
  int32 errorCode = 1;
  string message = 2;
}

message Heartbeat {
  int64 serverTimeMs = 1;
}

message PrivateMessageReq {
  string sessionId = 1;
  int64 clientMsgId = 2;
  int64 conversationId = 3;
  int64 toUid = 4;

  // 改为 repeated，支持组合消息（既有文本又有图片等）
  repeated MessageContent contents = 10;
}

message GroupMessageReq {
  string sessionId = 1;
  int64 clientMsgId = 2;
  int64 conversationId = 3;
  int64 groupId = 4;

  // 改为 repeated，支持组合消息
  repeated MessageContent contents = 10;
}

// 新增：统一的消息内容结构，使用 oneof 区分不同类型
message MessageContent {
  oneof content {
    EncryptedText encryptedText = 1;
    PlainText plainText = 2;
    MediaMetadata media = 3;
  }
}

// 新增：明文文本（群聊用）
message PlainText {
  string text = 1;
}

message ChatMessageDelivery {
  int64 msgId = 1;
  int64 seq = 2;
  int64 serverTimeMs = 3;
  int64 conversationId = 4;
  int64 fromUid = 5;

  // 改为 repeated，支持组合消息下发
  repeated MessageContent contents = 10;

  // 保留旧字段用于兼容（可选）
  oneof payload {
    PrivatePayload privatePayload = 11;
    GroupPayload groupPayload = 12;
  }
}

message PrivatePayload {
  int64 toUid = 1;
  repeated MessageContent contents = 2;
}

message GroupPayload {
  int64 groupId = 1;
  repeated MessageContent contents = 2;
}

message ClientReceiveAck {
  string sessionId = 1;
  int64 conversationId = 2;
  int64 latestReceivedSeq = 3;
}

message DeliveredAck {
  int64 conversationId = 1;
  int64 toUid = 2;
  int64 latestReceivedSeq = 3;
  int64 serverTimeMs = 4;
}

message EncryptedText {
  bytes nonce = 1;
  bytes ciphertext = 2;
}

message MediaMetadata {
  MediaType type = 1;
  string mediaUrl = 2;
  string thumbnailUrl = 3;
  int64 fileSize = 4;
  string mimeType = 5;
  string fileName = 6;
  int32 duration = 7;
  int32 width = 8;
  int32 height = 9;
  string previewText = 10;
  bytes waveformData = 11;
}

enum MediaType {
  IMAGE = 0;
  VIDEO = 1;
  AUDIO = 2;
  FILE = 3;
}

syntax = "proto3";

package mochat.internal.common.v1;

import "mochat/v1/chat.proto";

option java_multiple_files = true;
option java_package = "com.github.lystran.mochat.protocol.internal.common.v1";

message SessionPrincipal {
  string session_id = 1;
  int64 user_id = 2;
  int64 session_version = 3;
}

// 保留旧的消息类型用于向后兼容
message PrivateDeliveryContent {
  int64 to_uid = 1;
  repeated mochat.v1.MessageContent contents = 2;
}

message GroupDeliveryContent {
  int64 group_id = 1;
  repeated mochat.v1.MessageContent contents = 2;
}

message DeliveryEnvelope {
  int64 conversation_id = 1;
  int64 msg_id = 2;
  int64 seq = 3;
  int64 server_time_ms = 4;
  int64 from_uid = 5;

  // 新增：使用统一的 MessageContent 列表（支持多媒体）
  repeated mochat.v1.MessageContent contents = 10;

  // 保留旧的 oneof 用于向后兼容（可选）
  oneof legacy_payload {
    PrivateDeliveryContent private_content = 11;
    GroupDeliveryContent group_content = 12;
  }
}

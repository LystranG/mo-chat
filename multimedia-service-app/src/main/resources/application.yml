micronaut:
  application:
    name: multimedia-service
  server:
    port: 8083

  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT15S

endpoints:
  prometheus:
    enabled: true
    sensitive: false

mochat:
  flyway:
    locations: classpath:db/migration
  postgres:
    url: ${MOCHAT_POSTGRES_URL:`jdbc:postgresql://127.0.0.1:15432/mochat`}
    username: ${MOCHAT_POSTGRES_USERNAME:mochat}
    password: ${MOCHAT_POSTGRES_PASSWORD:mochat}
  media:
    storage:
      type: rustfs
      rustfs:
        endpoint: ${RUSTFS_ENDPOINT:https://8298b90af3166953e57edc8ceba2bb79.r2.cloudflarestorage.com}
        access-key: ${RUSTFS_ACCESS_KEY:}
        secret-key: ${RUSTFS_SECRET_KEY:}
        bucket: ${RUSTFS_BUCKET:picgo}
        region: ${RUSTFS_REGION:auto}
      max-file-size: ${MOCHAT_MEDIA_MAX_FILE_SIZE:104857600}
      allowed-types: image/jpeg,image/png,image/gif,image/webp,audio/mpeg,audio/wav,video/mp4,application/pdf
  message-service:
    inbound-consumer:
      enabled: false

logging:
  level:
    root: INFO

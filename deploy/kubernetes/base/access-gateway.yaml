apiVersion: v1
kind: Service
metadata:
  name: access-gateway-headless
  namespace: mochat
  labels:
    app.kubernetes.io/name: access-gateway
    app.kubernetes.io/part-of: mochat
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: access-gateway
  ports:
    - name: grpc
      port: 19093
      targetPort: 19093
---
apiVersion: v1
kind: Service
metadata:
  name: access-gateway-tcp
  namespace: mochat
  labels:
    app.kubernetes.io/name: access-gateway
    app.kubernetes.io/part-of: mochat
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: access-gateway
  ports:
    - name: tcp
      port: 9000
      targetPort: 9000
      nodePort: 32000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: access-gateway
  namespace: mochat
  labels:
    app.kubernetes.io/name: access-gateway
    app.kubernetes.io/part-of: mochat
spec:
  serviceName: access-gateway-headless
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: access-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-gateway
        app.kubernetes.io/part-of: mochat
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: access-gateway
          image: mochat/access-gateway:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mochat-runtime-config
            - configMapRef:
                name: mochat-external-dependencies
          env:
            - name: MOCHAT_ACCESS_GATEWAY_HTTP_PORT
              value: "18080"
            - name: MOCHAT_ACCESS_GATEWAY_TLS_CERTIFICATE_PATH
              value: /var/run/mochat/tls/tls.crt
            - name: MOCHAT_ACCESS_GATEWAY_TLS_PRIVATE_KEY_PATH
              value: /var/run/mochat/tls/tls.key
            - name: MOCHAT_ACCESS_GATEWAY_TLS_SELF_SIGNED
              value: "false"
            - name: MOCHAT_ACCESS_GATEWAY_DRAIN_SHUTDOWN_WAIT_ENABLED
              value: "true"
            - name: MOCHAT_ACCESS_GATEWAY_TCP_PORT
              value: "9000"
            - name: MOCHAT_ACCESS_GATEWAY_GRPC_PORT
              value: "19093"
            - name: MOCHAT_ACCESS_GATEWAY_DRAIN_GRACE_PERIOD
              value: "30s"
            - name: MOCHAT_RUNTIME_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MOCHAT_RUNTIME_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: admin
              containerPort: 18080
            - name: tcp
              containerPort: 9000
            - name: grpc
              containerPort: 19093
          volumeMounts:
            - name: access-gateway-tls
              mountPath: /var/run/mochat/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /internal/lifecycle/readyz
              port: 18080
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /internal/lifecycle/livez
              port: 18080
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              httpGet:
                path: /internal/lifecycle/drain
                port: 18080
      volumes:
        - name: access-gateway-tls
          secret:
            secretName: access-gateway-tls

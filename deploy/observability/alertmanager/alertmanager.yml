route:
  receiver: aiops-webhook
  group_by: ["alertname", "service", "project_id"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: aiops-webhook
    webhook_configs:
      - url: "http://host.docker.internal:8000/api/v1/alerts/webhook"
        send_resolved: true
        http_config:
          http_headers:
            X-Project-Id:
              values: ["mochat-local"]
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/aiops-token

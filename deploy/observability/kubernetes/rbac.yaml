apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mochat-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: mochat-observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: mochat-observability
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: mochat-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mochat-observability-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: mochat-observability
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mochat-observability-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: mochat-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mochat-observability-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: mochat-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mochat-observability-promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: mochat-observability
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mochat-observability-promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: mochat-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mochat-observability-promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: mochat-observability

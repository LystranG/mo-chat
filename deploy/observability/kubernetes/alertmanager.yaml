apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-aiops-token
  namespace: mochat-observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: mochat-observability
type: Opaque
stringData:
  # 演示占位 token。接入真实 AIOps 时用 kubectl create secret 覆盖同名 Secret。
  aiops-token: replace-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: mochat-observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: mochat-observability
data:
  alertmanager.yml: |
    route:
      receiver: aiops-webhook
      group_by: ["alertname", "service", "project_id"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h

    receivers:
      - name: aiops-webhook
        webhook_configs:
          - url: "http://aiops-mo-chat-aiops.mochat-aiops.svc.cluster.local:8000/api/v1/alerts/webhook"
            send_resolved: true
            http_config:
              http_headers:
                X-Project-Id:
                  values: ["mochat-prod"]
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/aiops-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: mochat-observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: mochat-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: mochat-observability
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: token
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: token
          secret:
            secretName: alertmanager-aiops-token
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: mochat-observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: mochat-observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: mochat-observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: mochat-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Example target for local Helm integration. Start
  # `kubectl -n mochat port-forward pod/access-gateway-0 18080:18080`
  # and enable the chart's Prometheus annotations only after the service
  # actually exposes /prometheus.
  - job_name: mochat-port-forward
    metrics_path: /prometheus
    static_configs:
      - targets:
          - host.docker.internal:18080
        labels:
          service: access-gateway
          project_id: mochat-local

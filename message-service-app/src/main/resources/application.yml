micronaut:
  application:
    name: message-service

mochat:
  runtime:
    pod:
      name: ${MOCHAT_RUNTIME_POD_NAME:}
      namespace: ${MOCHAT_RUNTIME_POD_NAMESPACE:default}
    gateway:
      identity-mode: ${MOCHAT_GATEWAY_IDENTITY_MODE:CONFIGURED}
      identity-value: ${MOCHAT_RUNTIME_GATEWAY_IDENTITY_VALUE:access-gateway-local}
      discovery-mode: ${MOCHAT_GATEWAY_DISCOVERY_MODE:AUTO}
      static-targets: {}
      headless-service: ${MOCHAT_GATEWAY_HEADLESS_SERVICE:access-gateway-headless}
      namespace: ${MOCHAT_GATEWAY_DISCOVERY_NAMESPACE:}
      cluster-domain: ${MOCHAT_K8S_CLUSTER_DOMAIN:cluster.local}
      grpc-port: ${MOCHAT_GATEWAY_DISCOVERY_GRPC_PORT:19093}
  redis:
    uri: ${MOCHAT_REDIS_URI:redis://127.0.0.1:6379}
  rocketmq:
    name-server: ${MOCHAT_ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
    producer-group: ${MOCHAT_ROCKETMQ_PRODUCER_GROUP:mochat-message-producer}
    topic: ${MOCHAT_ROCKETMQ_TOPIC:mochat.messages}
  message-service:
    grpc:
      port: ${MOCHAT_MESSAGE_SERVICE_GRPC_PORT:19092}
    id:
      worker-id: ${MOCHAT_MESSAGE_SERVICE_ID_WORKER_ID:1}
    inbound-consumer:
      enabled: ${MOCHAT_MESSAGE_SERVICE_INBOUND_CONSUMER_ENABLED:false}
    dependencies:
      api-grpc-enabled: ${MOCHAT_MESSAGE_SERVICE_API_GRPC_ENABLED:true}
      gateway-grpc-enabled: ${MOCHAT_MESSAGE_SERVICE_GATEWAY_GRPC_ENABLED:true}
      mq-enabled: ${MOCHAT_MESSAGE_SERVICE_MQ_ENABLED:true}
      redis-enabled: ${MOCHAT_MESSAGE_SERVICE_REDIS_ENABLED:true}
    route:
      gateway-targets: {}

grpc:
  server:
    port: ${MOCHAT_MESSAGE_SERVICE_GRPC_PORT:19092}
  channels:
    api-service:
      address: ${MOCHAT_API_SERVICE_GRPC_ADDRESS:api-service:19091}
      plaintext: true

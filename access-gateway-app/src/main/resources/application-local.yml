mochat:
  redis:
    uri: redis://127.0.0.1:6379
  runtime:
    gateway:
      identity-mode: CONFIGURED
      identity-value: gateway-a
      discovery-mode: STATIC_MAP
  access-gateway:
    route:
      gateway-pod: gateway-a

grpc:
  channels:
    api-service:
      address: 127.0.0.1:19091
      plaintext: true
    message-service:
      address: 127.0.0.1:19092
      plaintext: true

name: mochat

services:
  postgres:
    image: docker.1ms.run/postgres:17
    shm_size: 128mb
    environment:
      - POSTGRES_USER=mochat
      - POSTGRES_PASSWORD=mochat
      - TZ=Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - "./docker/postgres:/var/lib/postgresql/data"

  redis:
    image: docker.1ms.run/redis:7.2
    container_name: mochat-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./docker/redis:/data

  rocketmq-namesrv:
    image: docker.1ms.run/apache/rocketmq:5.3.2
    container_name: mochat-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: docker.1ms.run/apache/rocketmq:5.3.2
    container_name: mochat-rocketmq-broker
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    depends_on:
      - rocketmq-namesrv

  rustfs:
    image: docker.1ms.run/rustfs/rustfs:latest
    container_name: mochat-rustfs
    user: "root"
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=:9001
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    restart: unless-stopped

volumes:
  rustfs-data:
  rustfs-logs:

